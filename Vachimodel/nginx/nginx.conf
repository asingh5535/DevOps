# Vachi: serves the web UI and reverse-proxies the API.

# Basic abuse protection: 10 requests/second per client IP, with short bursts allowed.
limit_req_zone $binary_remote_addr zone=vachi_api:10m rate=10r/s;

upstream vachi_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 10m;

    root /usr/share/nginx/html;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/(api|v1)/ {
        limit_req zone=vachi_api burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://vachi_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming answers (Server-Sent Events): pass each piece through immediately
        # instead of buffering, and allow long answers.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        include /etc/nginx/snippets/security-headers.conf;
    }

    # Built JS/CSS have content hashes in their names, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Single-page app: unknown paths load index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}

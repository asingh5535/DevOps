[project]
name = "vachi"
version = "0.1.0"
description = "Vachi: a plug-and-play AI assistant platform"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "httpx>=0.28.1",
    "openai>=3.28.0",
    "pydantic>=2.14.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
vachi = "vachi.cli:main"

[project.entry-points."vachi.providers"]
ollama = "vachi.providers.ollama:OllamaProvider"
anthropic = "vachi.providers.anthropic:AnthropicProvider"
openai = "vachi.providers.openai_compat:OpenAICompatProvider"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-api
  namespace: applications
  labels:
    app: sample-api
    team: backend
    env: local
    cost-center: dev001
    version: "1.0.0"
    managed-by: manual
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-api
  template:
    metadata:
      labels:
        app: sample-api
        team: backend
        env: local
        cost-center: dev001
        version: "1.0.0"
    spec:
      containers:
        - name: api
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-frontend
  namespace: applications
  labels:
    app: sample-frontend
    team: frontend
    env: local
    cost-center: dev001
    version: "1.0.0"
    managed-by: manual
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-frontend
  template:
    metadata:
      labels:
        app: sample-frontend
        team: frontend
        env: local
        cost-center: dev001
        version: "1.0.0"
    spec:
      containers:
        - name: frontend
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 30m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-worker
  namespace: applications
  labels:
    app: sample-worker
    team: data
    env: local
    cost-center: dev002
    version: "2.1.0"
    managed-by: manual
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-worker
  template:
    metadata:
      labels:
        app: sample-worker
        team: data
        env: local
        cost-center: dev002
        version: "2.1.0"
    spec:
      containers:
        - name: worker
          image: busybox:latest
          command: ["sh", "-c", "while true; do sleep 30; done"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
